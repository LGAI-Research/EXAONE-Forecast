[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exaone-forecast"
version = "1.0.0"
description = "EXAONE Forecast — LG AI Research's family of time series foundation models"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "LG AI Research" }]
keywords = [
    "time-series",
    "forecasting",
    "foundation-model",
    "attention-free",
    "finance",
    "exaone",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Shared by every model in the family: the backbone, the checkpoint loader,
# and the Hub download path. Installing the package bare gives you all of it.
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "transformers>=4.30",
    "einops>=0.6",
    "safetensors>=0.3",
    "huggingface_hub>=0.20",
]

# Per-model extras. A model that needs a dependency the rest of the family does
# not use declares it here, so installing one model never pulls in another
# model's requirements:
#
#     pip install "exaone-forecast[finance]"
#
# EXAONE Finance runs on the shared dependencies alone, so its extra is empty.
# It is declared anyway: the selector is part of the published install command,
# and keeping it stable means a future model can add requirements without
# changing what existing users install.
[project.optional-dependencies]
finance = []
# Union of every extra above. Listed literally rather than as a self-reference
# ("exaone-forecast[finance]"), which pip would try to resolve from an index the
# package is not published to.
all = []

[project.urls]
Homepage = "https://github.com/LGAI-Research/EXAONE-Forecast"

[tool.setuptools]
package-dir = { "" = "src" }
# Ship the license and the open-source notice inside the installed distribution,
# not only in the source tree: an install from git builds a wheel and installs
# that, so anything omitted here never reaches the user's environment.
license-files = ["LICENSE", "Notice.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["exaone_forecast*"]
